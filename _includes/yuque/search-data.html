<script>
window.YQ_DOCS = [
{% for post in site.posts %}
  {% include yuque/resolve-book.html post=post %}
  {
    "title": {{ post.title | strip | jsonify }},
    "sub": {{ post.subtitle | default: "" | strip | jsonify }},
    "url": {{ post.url | prepend: site.baseurl | jsonify }},
    "book": {{ resolved_book_title | default: "未分类" | jsonify }},
    "tags": {{ post.tags | join: " " | jsonify }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
];
</script>
