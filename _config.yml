# Site settings
title: Pelhans Blog
SEOTitle: Pelhans 的博客
header-img: img/home_haizei.jpg
email: me@pelhans.com
description: "这里是 @Pelhans 的博客"
keyword: "自然语言处理, 知识图谱, 物理"
baseurl: ""                             # for example, '/blog' if your blog hosted on 'host/blog'



# SNS settings
#zhihu_username:     pelhans
RSS: false
github_username:    Pelhans



# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
exclude: ["less","node_modules","Gruntfile.js","package.json","README.md","README.zh.md","vendor","Gemfile","Gemfile.lock","Gemfile.bak","build_page.sh","install_dependency.sh","portfolio"]
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`



# Gems
# from PR#40, to support local preview for Jekyll 3.0
plugins: []



# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM                            # use Github Flavored Markdown !important
  enable_coderay: true

# Disqus settings

# disqus_username: Lucy

gitalk:
    enable: false
    owner: pelhans
    repo: pelhans.github.io
    clientID: 15b9fe2f4c186c1a0331
    clientSecret: 2cfe93101b4693abbccf523b126d8ffcc2985a7a
    admin: pelhans

# Netease setttings
netease_comment: false
#git_issue : true


# Analytics settings
# Baidu Analytics 
# ba_track_id: '243ea57b3beeb8b347d29ba2e877eb56'

# Google Analytics
#ga_track_id: 'UA-49627206-1'            # Format: UA-xxxxxx-xx
#ga_domain: pelhans.me



# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: "NLP & SUSY 学徒<br>"
sidebar-avatar: /img/avatar-pelhans.jpg      # use absolute URL, seeing it's used in both `/` and `/about/`



# Featured Tags
featured-tags: true                     # whether or not using Feature-Tags
featured-condition-size: 1              # A tag will be featured if the size of it is more than this condition value



# Progressive Web Apps
chrome-tab-theme-color: "#ffffff"
service-worker: false


# Online editing (语雀式在线编辑 + 同步到 GitHub)
# 仅对 allowed_users 中的 GitHub 账号开放。Token 由用户在前端输入并存入 localStorage。
edit:
  enabled: true
  owner: Pelhans
  repo: pelhans.github.io
  branch: master
  # 只有这些 GitHub 用户名登录后才能看到“编辑”按钮并保存
  allowed_users:
    - pelhans

# 划线评论（匿名，存到 GitHub Issues，复用 edit 的 PAT）
comments:
  enabled: true
  # Issue 标题前缀 / 绑定文章的 label 前缀
  label_prefix: "post:"
  # 每篇文章的 Issue 用 label = post:<文章相对路径> 唯一绑定

