# 知识库（语雀式层级结构）定义
#
# 每个 book 是一个知识库，slug 决定 URL：/book/<slug>/
# groups 为知识库下的目录，支持多级嵌套（group 可含 children: [...]）。
# 每个节点用以下字段把文章自动归入该节点：
#   - tag:    按文章 tags 精确匹配（去空格、忽略大小写）
#   - prefix: 按文章文件名去掉日期后的前缀匹配（如 ml_note1 -> ml_note）
# 一篇文章只会归入第一个命中的节点；未命中任何节点的文章进入 "其它" 节点。
# 子目录（children）需使用与父节点不同的 tag，这样新建文档选择子目录时会写入该
# 子目录的 tag，文章即可正确挂载到对应子目录。

# ===== 深度学习库（原深度学习、机器学习、强化学习、计算机库合并）=====
- slug: deep-learning
  title: 计算机
  icon: "🧠"
  desc: 深度学习、机器学习经典算法、强化学习与计算机相关
  groups:
    - title: 深度学习基础知识
      prefix: [deep_learning-note]
    - title: 机器学习笔记
      prefix: [ml_note]
    - title: PRML 读书笔记
      prefix: [prml_note]
      tag: [PRML]
    - title: David Silver 强化学习
      prefix: [deepRL-ch, deepRL]
      tag: [Reinforment Learning]
    - title: Agent Harness
      tag: [Agent Harness 技术调研]
      children:
        - title: Agent Harness 论文解读
          tag: [Agent Harness 论文解读]
        - title: Codex 代码解读
          tag: [Codex 代码解读]
    - title: 其它
      tag: [计算机]

- slug: knowledge-graph
  title: 知识图谱
  icon: "🕸"
  desc: 知识图谱构建、语义网、实体链接与关系抽取
  groups:
    - title: 从零构建知识图谱
      prefix: [kg_from_0_note]
    - title: 小象学院知识图谱
      prefix: [xiaoxiangkg-note]
    - title: 语义网与本体
      prefix: [semantic_web_note, semantic_note, kg_turtle]
    - title: 论文笔记
      prefix: [kg_paper-note, relation_extraction_note, named_entity_recognition, entity_linking, entity_alignment]
    - title: 图数据库
      prefix: [kg_neo4j_cypher]
    - title: 其它
      tag: [Knowledge Graph]

